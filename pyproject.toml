[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridcast-pjm"
version = "0.1.0"
description = "Historical PJM demand forecasting and Power BI decision-support prototype"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scikit-learn", "matplotlib", "scipy", "nbformat", "nbclient", "ipykernel", "jsonschema"]

[tool.setuptools.packages.find]
where = ["src"]
